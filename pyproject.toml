[project]
name = "travelnusa-app"
version = "0.1.0"
description = "TravelNusa FastAPI Backend"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
